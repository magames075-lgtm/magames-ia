name: Command AI APK
on:
  push:
    branches: [main]
    paths: ['command-ai/**', '.github/workflows/command-ai.yml']
  workflow_dispatch:
permissions:
  contents: write
env:
  VERSION: 1.1.0
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - name: Chave fixa (para updates instalarem por cima)
        run: |
          if [ ! -f command-ai/keys/cmdai.keystore ]; then
            mkdir -p command-ai/keys
            keytool -genkeypair -keystore command-ai/keys/cmdai.keystore -alias android -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=MaGames Tecnologia, O=MaGames, C=BR"
            git config user.name github-actions; git config user.email github-actions@users.noreply.github.com
            git add command-ai/keys/cmdai.keystore && git commit -m "Command AI: chave de assinatura [skip ci]" && git push
          fi
      - name: Projeto Android
        working-directory: command-ai
        run: |
          npm install --no-audit --no-fund
          npx cap add android
          npx cap sync android
          sed -i 's/android:usesCleartextTraffic="true"//' android/app/src/main/AndroidManifest.xml || true
      - name: Compilar
        working-directory: command-ai/android
        run: |
          chmod +x gradlew
          sed -i "s/versionName \".*\"/versionName \"${VERSION}\"/" app/build.gradle
          ./gradlew assembleRelease --no-daemon -q
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          $BT/zipalign -f 4 app/build/outputs/apk/release/app-release-unsigned.apk a.apk
          $BT/apksigner sign --ks ../keys/cmdai.keystore --ks-pass pass:android --key-pass pass:android --out ../../command-ai.apk a.apk
          $BT/apksigner verify ../../command-ai.apk && ls -la ../../command-ai.apk
          $BT/aapt dump badging ../../command-ai.apk | grep -E "package|application-label" | head -3
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: command-ai-v${{ env.VERSION }}
          name: Command AI v${{ env.VERSION }}
          body: "Command AI: IA que transforma um comando em código completo e pronto, com pesquisa na internet. Instale o command-ai.apk (Android 7+)."
          files: command-ai.apk
          make_latest: false
