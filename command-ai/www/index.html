<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0f17">
<title>Command AI</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <div class="logo">⌘ <b>Command</b> AI</div>
  <div class="hbtns">
    <button id="btnHist" title="Histórico">🕘</button>
    <button id="btnCfg" title="Configurações">⚙️</button>
  </div>
</header>

<main id="home">
  <p class="sub">Escreva o comando. A IA analisa, pesquisa na internet, decide tudo sozinha e entrega o código completo e pronto.</p>
  <textarea id="cmd" placeholder="Ex.: crie um app de lista de tarefas em React com login, modo escuro e salvamento no navegador"></textarea>
  <div class="row">
    <label class="chk"><input type="checkbox" id="deep" checked> Pesquisar na internet</label>
    <button id="go" class="primary">Gerar código ▶</button>
  </div>
  <div id="steps"></div>
  <div id="actions" class="row hidden">
    <button id="copyAll">Copiar tudo</button>
    <button id="stop" class="hidden">Parar</button>
  </div>
  <article id="out"></article>
</main>

<section id="cfg" class="panel hidden">
  <h2>Configurações</h2>
  <label>Provedor de IA</label>
  <select id="prov">
    <option value="gemini">Google Gemini (recomendado: respostas longas + Google Search)</option>
    <option value="groq">Groq (muito rápido, busca na web via Compound)</option>
  </select>
  <label>Sua chave de API</label>
  <input id="key" type="password" placeholder="Cole sua chave aqui" autocomplete="off">
  <p class="hint" id="keyHint"></p>
  <label>Modelo (opcional)</label>
  <input id="model" placeholder="padrão automático">
  <p class="hint">A chave fica salva só neste aparelho e vai direto para o provedor.</p>
  <div class="row"><button id="saveCfg" class="primary">Salvar</button><button id="closeCfg">Fechar</button></div>
</section>

<section id="hist" class="panel hidden">
  <h2>Histórico</h2>
  <div id="histList"></div>
  <div class="row"><button id="clearHist">Limpar</button><button id="closeHist">Fechar</button></div>
</section>

<div id="toast" class="hidden"></div>
<script src="app.js"></script>
</body>
</html>
